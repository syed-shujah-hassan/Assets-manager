<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RMS Admin Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;background:#f1f5f9;color:#0f172a;-webkit-font-smoothing:antialiased}
    :root{--navy:#0a1628;--navy-light:#1b2b4b;--navy-medium:#142240;--teal:#0d9488;--teal-light:#14b8a6;--teal-dark:#0f766e;--white:#fff;--bg:#f1f5f9;--card:#fff;--text:#0f172a;--text-sec:#64748b;--text-mut:#94a3b8;--border:#e2e8f0;--border-l:#f1f5f9;--danger:#dc2626;--danger-l:#fee2e2;--warn:#f59e0b;--warn-l:#fef3c7;--success:#10b981;--success-l:#d1fae5;--info:#3b82f6;--info-l:#dbeafe;--sh:0 1px 3px rgba(10,22,40,.06),0 1px 2px rgba(10,22,40,.04);--sh-md:0 4px 6px rgba(10,22,40,.07),0 2px 4px rgba(10,22,40,.04);--sh-lg:0 10px 15px rgba(10,22,40,.08),0 4px 6px rgba(10,22,40,.04);--r:12px;--rs:8px;--rl:16px}
    a{text-decoration:none;color:inherit}
    input,select,textarea,button{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif}

    /* Login */
    .login-page{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--navy);position:relative;overflow:hidden}
    .login-bg{position:absolute;inset:0;background:radial-gradient(circle at 30% 20%,rgba(13,148,136,.12) 0%,transparent 50%),radial-gradient(circle at 70% 80%,rgba(13,148,136,.08) 0%,transparent 50%)}
    .login-card{background:var(--card);border-radius:var(--rl);box-shadow:0 20px 60px rgba(0,0,0,.3);width:420px;max-width:90vw;padding:40px 36px;position:relative;z-index:1}
    .login-header{text-align:center;margin-bottom:32px}
    .login-logo-icon{width:60px;height:60px;border-radius:16px;background:var(--navy);color:var(--teal-light);display:inline-flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;letter-spacing:1px;margin-bottom:16px}
    .login-title{font-size:22px;font-weight:700;color:var(--text);margin-bottom:4px}
    .login-subtitle{font-size:14px;color:var(--text-sec)}
    .login-form{display:flex;flex-direction:column;gap:4px}
    .login-error{background:var(--danger-l);color:var(--danger);padding:10px 14px;border-radius:var(--rs);font-size:13px;font-weight:500;margin-bottom:8px}
    .login-btn{width:100%;padding:14px;border-radius:var(--rs);border:none;background:var(--teal);color:var(--white);font-size:15px;font-weight:600;cursor:pointer;transition:background .2s,transform .1s;margin-top:8px}
    .login-btn:hover{background:var(--teal-dark)}
    .login-btn:active{transform:scale(.99)}
    .login-footer{text-align:center;margin-top:24px;font-size:12px;color:var(--text-mut)}

    /* Layout */
    .admin-layout{display:flex;min-height:100vh}
    .sidebar{position:fixed;left:0;top:0;bottom:0;width:260px;background:var(--navy);display:flex;flex-direction:column;z-index:100;transition:width .3s ease;overflow:hidden}
    .sidebar.collapsed{width:72px}
    .sidebar-hdr{display:flex;align-items:center;justify-content:space-between;padding:18px 16px;border-bottom:1px solid rgba(255,255,255,.08)}
    .sidebar-logo{display:flex;align-items:center;gap:10px;overflow:hidden}
    .logo-icon{width:38px;height:38px;border-radius:10px;background:var(--teal);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:white;flex-shrink:0;letter-spacing:.5px}
    .logo-text{font-size:15px;font-weight:600;color:white;white-space:nowrap}
    .sidebar-toggle{width:28px;height:28px;border-radius:6px;border:none;background:rgba(255,255,255,.08);color:rgba(255,255,255,.5);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;transition:background .15s;flex-shrink:0}
    .sidebar-toggle:hover{background:rgba(255,255,255,.15)}
    .sidebar-nav{flex:1;padding:12px 8px;display:flex;flex-direction:column;gap:2px;overflow-y:auto}
    .sidebar-link{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;color:rgba(255,255,255,.6);font-size:14px;font-weight:500;transition:all .15s;white-space:nowrap;cursor:pointer;border:none;background:none;width:100%;text-align:left}
    .sidebar-link:hover{background:rgba(255,255,255,.08);color:rgba(255,255,255,.9)}
    .sidebar-link.active{background:rgba(13,148,136,.2);color:var(--teal-light)}
    .sidebar-icon{font-size:18px;width:24px;text-align:center;flex-shrink:0}
    .sidebar-label{white-space:nowrap;overflow:hidden}
    .sidebar-footer{padding:16px;border-top:1px solid rgba(255,255,255,.08)}
    .sidebar-ver{display:flex;flex-direction:column;gap:2px;font-size:11px;color:rgba(255,255,255,.3)}
    .ver-num{font-weight:600;color:rgba(255,255,255,.2)}

    .admin-main{flex:1;margin-left:260px;transition:margin-left .3s ease;display:flex;flex-direction:column;min-height:100vh}
    .admin-main.collapsed{margin-left:72px}

    /* Topbar */
    .topbar{height:64px;background:var(--card);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 28px;box-shadow:var(--sh);position:sticky;top:0;z-index:50}
    .topbar-left{display:flex;align-items:center;gap:12px}
    .topbar-title{font-size:17px;font-weight:700;color:var(--navy)}
    .topbar-badge{font-size:11px;font-weight:600;color:var(--teal);background:rgba(13,148,136,.08);padding:4px 10px;border-radius:16px;text-transform:uppercase;letter-spacing:.5px}
    .topbar-right{display:flex;align-items:center;gap:16px}
    .topbar-user{display:flex;align-items:center;gap:10px}
    .topbar-avatar{width:36px;height:36px;border-radius:10px;background:var(--navy);color:white;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700}
    .topbar-uinfo{display:flex;flex-direction:column}
    .topbar-name{font-size:14px;font-weight:600;color:var(--text)}
    .topbar-role{font-size:11px;color:var(--text-mut)}
    .topbar-logout{padding:8px 16px;border-radius:8px;border:1px solid var(--border);background:var(--white);font-size:13px;font-weight:500;color:var(--text-sec);cursor:pointer;transition:all .15s}
    .topbar-logout:hover{background:var(--danger-l);color:var(--danger);border-color:var(--danger-l)}

    /* Content */
    .admin-content{flex:1;padding:28px;max-width:1400px}
    .page-hdr{margin-bottom:24px}
    .page-title{font-size:24px;font-weight:700;color:var(--text);margin-bottom:4px}
    .page-sub{font-size:14px;color:var(--text-sec)}

    /* Stats */
    .stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-bottom:28px}
    .stat-card{background:var(--card);border-radius:var(--r);padding:20px;box-shadow:var(--sh);border:1px solid var(--border-l);display:flex;align-items:center;gap:16px;transition:box-shadow .2s,transform .2s}
    .stat-card:hover{box-shadow:var(--sh-md);transform:translateY(-1px)}
    .stat-icon{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
    .stat-info{flex:1}
    .stat-val{font-size:26px;font-weight:700;color:var(--text);line-height:1.2}
    .stat-lbl{font-size:13px;color:var(--text-sec);margin-top:2px}

    /* Cards */
    .card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);border:1px solid var(--border-l);overflow:hidden;margin-bottom:20px}
    .card-hdr{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
    .card-title{font-size:16px;font-weight:600;color:var(--text)}
    .card-body{padding:0}
    .card-body-pad{padding:22px}

    /* Tables */
    .tbl-wrap{overflow-x:auto}
    table{width:100%;border-collapse:collapse}
    thead{background:var(--bg)}
    th{padding:12px 18px;text-align:left;font-size:12px;font-weight:600;color:var(--text-sec);text-transform:uppercase;letter-spacing:.5px;white-space:nowrap}
    td{padding:14px 18px;font-size:14px;color:var(--text);border-top:1px solid var(--border-l);vertical-align:middle}
    tr:hover td{background:rgba(241,245,249,.5)}
    tr.click{cursor:pointer}
    tr.click:hover td{background:rgba(13,148,136,.04)}

    /* Badges */
    .badge{display:inline-flex;align-items:center;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:600;white-space:nowrap}
    .b-pending{background:var(--warn-l);color:var(--warn)}
    .b-assigned,.b-enroute{background:var(--info-l);color:var(--info)}
    .b-resolved{background:var(--success-l);color:var(--success)}
    .b-cancelled{background:var(--danger-l);color:var(--danger)}
    .b-available{background:var(--success-l);color:var(--success)}
    .b-busy{background:var(--warn-l);color:var(--warn)}
    .b-inactive{background:var(--danger-l);color:var(--danger)}

    /* Buttons */
    .btn{display:inline-flex;align-items:center;gap:6px;padding:10px 18px;border-radius:var(--rs);font-size:14px;font-weight:600;border:none;cursor:pointer;transition:all .15s;white-space:nowrap}
    .btn:hover{transform:translateY(-1px);box-shadow:var(--sh-md)}
    .btn:active{transform:translateY(0)}
    .btn-pri{background:var(--teal);color:var(--white)}
    .btn-pri:hover{background:var(--teal-dark)}
    .btn-sec{background:var(--bg);color:var(--text);border:1px solid var(--border)}
    .btn-dan{background:var(--danger-l);color:var(--danger)}
    .btn-sm{padding:6px 12px;font-size:13px}

    /* Forms */
    .fg{margin-bottom:18px}
    .fl{display:block;font-size:13px;font-weight:600;color:var(--text);margin-bottom:6px}
    .fi,.fs,.ft{width:100%;padding:12px 14px;border-radius:var(--rs);border:1px solid var(--border);background:var(--bg);font-size:14px;color:var(--text);transition:border-color .2s,box-shadow .2s}
    .fi:focus,.fs:focus,.ft:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px rgba(13,148,136,.1)}
    .ft{resize:vertical;min-height:80px}
    .fh{font-size:12px;color:var(--text-mut);margin-top:4px}

    /* Filters */
    .filter-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
    .filter-chip{padding:6px 16px;border-radius:20px;font-size:13px;font-weight:500;background:var(--bg);border:1px solid var(--border);cursor:pointer;transition:all .15s;color:var(--text-sec)}
    .filter-chip:hover{border-color:var(--teal);color:var(--teal)}
    .filter-chip.active{background:var(--navy);color:var(--white);border-color:var(--navy)}

    /* Modal */
    .modal-ov{position:fixed;inset:0;background:rgba(10,22,40,.5);display:flex;align-items:center;justify-content:center;z-index:1000;animation:fadeIn .15s}
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}
    .modal{background:var(--card);border-radius:var(--rl);box-shadow:var(--sh-lg);width:560px;max-width:90vw;max-height:85vh;overflow-y:auto;animation:slideUp .2s}
    @keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
    .modal-hdr{display:flex;align-items:center;justify-content:space-between;padding:20px 24px;border-bottom:1px solid var(--border)}
    .modal-title{font-size:18px;font-weight:700;color:var(--text)}
    .modal-close{width:36px;height:36px;border-radius:8px;border:none;background:var(--bg);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--text-sec);transition:background .15s}
    .modal-close:hover{background:var(--border)}
    .modal-body{padding:24px}

    .detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
    .detail-item{display:flex;flex-direction:column;gap:4px}
    .detail-label{font-size:12px;font-weight:600;color:var(--text-sec);text-transform:uppercase;letter-spacing:.5px}
    .detail-value{font-size:14px;color:var(--text);font-weight:500}
    .detail-full{grid-column:1/-1}

    .stars{color:var(--warn);font-size:16px;letter-spacing:2px}
    .loading{display:flex;align-items:center;justify-content:center;padding:60px;color:var(--text-mut);font-size:14px}
    .success-msg{background:var(--success-l);color:var(--success);padding:12px 16px;border-radius:var(--rs);font-size:14px;font-weight:500;margin-bottom:18px}
    .two-col{display:grid;grid-template-columns:1fr 1fr;gap:20px}

    .stat-center{text-align:center;width:100%}
    .quick-row{display:flex;justify-content:space-between;align-items:center;padding:4px 0}
    .quick-label{color:var(--text-sec);font-size:14px}
    .quick-val{font-weight:700;font-size:18px}
    .divider{height:1px;background:var(--border-l);margin:14px 0}

    @media(max-width:900px){.admin-main,.admin-main.collapsed{margin-left:72px}.sidebar{width:72px}.sidebar-label,.logo-text,.sidebar-ver{display:none}.admin-content{padding:20px}.stats-grid{grid-template-columns:repeat(2,1fr)}.detail-grid{grid-template-columns:1fr}.two-col{grid-template-columns:1fr}}
    @media(max-width:600px){.stats-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.2.0/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.23.0/babel.min.js"></script>
<script type="text/babel">
const { useState, useEffect, createContext, useContext } = React;

// === API ===
const delay = (ms) => new Promise(r => setTimeout(r, ms));
const dummyRequests = [
  { id:"REQ-001",user:"Ahmed Khan",phone:"+92 300 1234567",time:"2026-02-20 08:30",location:"Block 7, Gulshan-e-Iqbal, Karachi",responder:"Rescue Unit Alpha",status:"Assigned",description:"Building fire on 3rd floor, smoke visible from outside. Multiple residents may be trapped.",priority:"High" },
  { id:"REQ-002",user:"Sara Ali",phone:"+92 311 9876543",time:"2026-02-20 09:15",location:"Shahrah-e-Faisal, near PIDC, Karachi",responder:"Unassigned",status:"Pending",description:"Road accident involving two vehicles near main intersection. Injuries reported.",priority:"Critical" },
  { id:"REQ-003",user:"Hassan Raza",phone:"+92 322 5551234",time:"2026-02-20 10:00",location:"North Nazimabad, Block H, Karachi",responder:"Rescue Unit Bravo",status:"En Route",description:"Gas leak detected in residential area. Strong smell of gas.",priority:"High" },
  { id:"REQ-004",user:"Fatima Noor",phone:"+92 333 7778899",time:"2026-02-19 14:00",location:"DHA Phase 6, Karachi",responder:"Rescue Unit Alpha",status:"Resolved",description:"Medical emergency - elderly person collapsed, unresponsive.",priority:"Critical" },
  { id:"REQ-005",user:"Ali Zafar",phone:"+92 345 1112233",time:"2026-02-18 16:00",location:"Korangi Industrial Area, Karachi",responder:"Rescue Unit Charlie",status:"Resolved",description:"Flood water entering ground floor homes after heavy rain.",priority:"Medium" },
  { id:"REQ-006",user:"Zainab Sheikh",phone:"+92 300 4445566",time:"2026-02-18 11:20",location:"Clifton Block 5, Karachi",responder:"Rescue Unit Delta",status:"Cancelled",description:"Minor fire in kitchen, already extinguished by residents.",priority:"Low" },
  { id:"REQ-007",user:"Bilal Ahmed",phone:"+92 312 9998877",time:"2026-02-20 07:45",location:"Saddar, Zaibunnisa Street, Karachi",responder:"Unassigned",status:"Pending",description:"Building wall collapsed partially, debris on road.",priority:"High" },
  { id:"REQ-008",user:"Nadia Hussain",phone:"+92 321 6667788",time:"2026-02-19 20:30",location:"Gulistan-e-Jauhar Block 14, Karachi",responder:"Rescue Unit Bravo",status:"Resolved",description:"Child stuck in elevator, building power failure.",priority:"Medium" },
];
const dummyResponders = [
  { id:"R1",name:"Rescue Unit Alpha",email:"alpha@rms.gov.pk",phone:"+92 300 1111111",zone:"South Karachi",availability:"Available",totalResolved:45,joinDate:"2024-01-15" },
  { id:"R2",name:"Rescue Unit Bravo",email:"bravo@rms.gov.pk",phone:"+92 300 2222222",zone:"East Karachi",availability:"Busy",totalResolved:38,joinDate:"2024-03-20" },
  { id:"R3",name:"Rescue Unit Charlie",email:"charlie@rms.gov.pk",phone:"+92 300 3333333",zone:"West Karachi",availability:"Available",totalResolved:52,joinDate:"2023-11-10" },
  { id:"R4",name:"Rescue Unit Delta",email:"delta@rms.gov.pk",phone:"+92 300 4444444",zone:"Central Karachi",availability:"Inactive",totalResolved:27,joinDate:"2024-06-01" },
  { id:"R5",name:"Rescue Unit Echo",email:"echo@rms.gov.pk",phone:"+92 300 5555555",zone:"North Karachi",availability:"Available",totalResolved:31,joinDate:"2024-08-15" },
];
const dummyUsers = [
  { id:"U1",name:"Ahmed Khan",email:"ahmed@email.com",phone:"+92 300 1234567",cnic:"42101-1234567-8",totalRequests:3 },
  { id:"U2",name:"Sara Ali",email:"sara@email.com",phone:"+92 311 9876543",cnic:"42201-9876543-2",totalRequests:1 },
  { id:"U3",name:"Hassan Raza",email:"hassan@email.com",phone:"+92 322 5551234",cnic:"42301-5551234-4",totalRequests:2 },
  { id:"U4",name:"Fatima Noor",email:"fatima@email.com",phone:"+92 333 7778899",cnic:"42401-7778899-6",totalRequests:1 },
  { id:"U5",name:"Ali Zafar",email:"ali@email.com",phone:"+92 345 1112233",cnic:"42501-1112233-0",totalRequests:4 },
  { id:"U6",name:"Zainab Sheikh",email:"zainab@email.com",phone:"+92 300 4445566",cnic:"42601-4445566-1",totalRequests:2 },
  { id:"U7",name:"Bilal Ahmed",email:"bilal@email.com",phone:"+92 312 9998877",cnic:"42701-9998877-3",totalRequests:1 },
  { id:"U8",name:"Nadia Hussain",email:"nadia@email.com",phone:"+92 321 6667788",cnic:"42801-6667788-5",totalRequests:3 },
];
const dummyFeedback = [
  { id:"FB-001",requestId:"REQ-004",user:"Fatima Noor",responder:"Rescue Unit Alpha",rating:5,comment:"Excellent response time. Very professional team.",date:"2026-02-19" },
  { id:"FB-002",requestId:"REQ-005",user:"Ali Zafar",responder:"Rescue Unit Charlie",rating:4,comment:"Good response, but took slightly longer than expected.",date:"2026-02-18" },
  { id:"FB-003",requestId:"REQ-008",user:"Nadia Hussain",responder:"Rescue Unit Bravo",rating:5,comment:"Saved my child's life. Incredibly grateful.",date:"2026-02-19" },
  { id:"FB-004",requestId:"REQ-003",user:"Hassan Raza",responder:"Rescue Unit Bravo",rating:3,comment:"Response was okay but communication could be better.",date:"2026-02-20" },
];
const dummyLogs = [
  { id:"L1",timestamp:"2026-02-20 10:12:00",action:"Request Created",details:"REQ-007 created by Bilal Ahmed" },
  { id:"L2",timestamp:"2026-02-20 10:00:00",action:"Request Created",details:"REQ-003 created by Hassan Raza" },
  { id:"L3",timestamp:"2026-02-20 09:55:00",action:"Responder Assigned",details:"Rescue Unit Bravo assigned to REQ-003" },
  { id:"L4",timestamp:"2026-02-20 09:15:00",action:"Request Created",details:"REQ-002 created by Sara Ali" },
  { id:"L5",timestamp:"2026-02-20 08:35:00",action:"Responder Assigned",details:"Rescue Unit Alpha assigned to REQ-001" },
  { id:"L6",timestamp:"2026-02-20 08:30:00",action:"Request Created",details:"REQ-001 created by Ahmed Khan" },
  { id:"L7",timestamp:"2026-02-19 20:30:00",action:"Request Created",details:"REQ-008 created by Nadia Hussain" },
  { id:"L8",timestamp:"2026-02-19 21:15:00",action:"Request Resolved",details:"REQ-008 resolved by Rescue Unit Bravo" },
  { id:"L9",timestamp:"2026-02-19 15:30:00",action:"Request Resolved",details:"REQ-004 resolved by Rescue Unit Alpha" },
  { id:"L10",timestamp:"2026-02-19 14:00:00",action:"Request Created",details:"REQ-004 created by Fatima Noor" },
  { id:"L11",timestamp:"2026-02-18 17:00:00",action:"Request Cancelled",details:"REQ-006 cancelled by admin" },
  { id:"L12",timestamp:"2026-02-18 16:45:00",action:"Request Resolved",details:"REQ-005 resolved by Rescue Unit Charlie" },
];

const api = {
  fetchRequests: async () => { await delay(300); return dummyRequests; },
  fetchResponders: async () => { await delay(300); return [...dummyResponders]; },
  fetchUsers: async () => { await delay(300); return dummyUsers; },
  fetchFeedback: async () => { await delay(300); return dummyFeedback; },
  fetchLogs: async () => { await delay(300); return dummyLogs; },
  fetchReports: async () => { await delay(200); return { totalRequests:dummyRequests.length, activeRequests:dummyRequests.filter(r=>r.status!=="Resolved"&&r.status!=="Cancelled").length, resolvedRequests:dummyRequests.filter(r=>r.status==="Resolved").length, totalResponders:dummyResponders.length, avgResponseTime:"8.5 min", avgRating:"4.3" }; },
  fetchSettings: async () => { await delay(200); return { searchRadius:5000, duplicateTimeWindow:30, defaultCity:"Karachi" }; },
  saveSettings: async (s) => { await delay(500); return { success:true, message:"Settings saved successfully" }; },
};

// === Status helpers ===
function statusBadge(s) {
  const c = { Pending:'b-pending', Assigned:'b-assigned', 'En Route':'b-enroute', Resolved:'b-resolved', Cancelled:'b-cancelled' }[s]||'b-pending';
  return <span className={`badge ${c}`}>{s}</span>;
}
function priorityBadge(p) {
  const c = { Critical:'b-cancelled', High:'b-pending', Medium:'b-assigned', Low:'b-resolved' }[p]||'';
  return <span className={`badge ${c}`}>{p}</span>;
}
function availBadge(a) {
  const c = { Available:'b-available', Busy:'b-busy', Inactive:'b-inactive' }[a]||'';
  return <span className={`badge ${c}`}>{a}</span>;
}

// === Pages ===
function DashboardPage() {
  const [stats,setStats]=useState(null); const [recent,setRecent]=useState([]); const [loading,setLoading]=useState(true);
  useEffect(()=>{Promise.all([api.fetchReports(),api.fetchRequests()]).then(([r,req])=>{setStats(r);setRecent(req.slice(0,5));setLoading(false);})},[]);
  if(loading) return <div className="loading">Loading dashboard...</div>;
  return <div>
    <div className="page-hdr"><h2 className="page-title">Dashboard</h2><p className="page-sub">System overview and key metrics</p></div>
    <div className="stats-grid">
      <div className="stat-card"><div className="stat-icon" style={{background:'rgba(59,130,246,.1)',color:'#3b82f6'}}>📋</div><div className="stat-info"><div className="stat-val">{stats.totalRequests}</div><div className="stat-lbl">Total Requests</div></div></div>
      <div className="stat-card"><div className="stat-icon" style={{background:'rgba(245,158,11,.1)',color:'#f59e0b'}}>⚡</div><div className="stat-info"><div className="stat-val">{stats.activeRequests}</div><div className="stat-lbl">Active Requests</div></div></div>
      <div className="stat-card"><div className="stat-icon" style={{background:'rgba(16,185,129,.1)',color:'#10b981'}}>✅</div><div className="stat-info"><div className="stat-val">{stats.resolvedRequests}</div><div className="stat-lbl">Resolved</div></div></div>
      <div className="stat-card"><div className="stat-icon" style={{background:'rgba(13,148,136,.1)',color:'#0d9488'}}>🚑</div><div className="stat-info"><div className="stat-val">{stats.totalResponders}</div><div className="stat-lbl">Total Responders</div></div></div>
    </div>
    <div className="two-col">
      <div className="card"><div className="card-hdr"><span className="card-title">Recent Requests</span></div><div className="card-body tbl-wrap"><table><thead><tr><th>ID</th><th>User</th><th>Time</th><th>Status</th></tr></thead><tbody>{recent.map(r=><tr key={r.id}><td style={{fontWeight:600,color:'var(--navy)'}}>{r.id}</td><td>{r.user}</td><td style={{color:'var(--text-sec)',fontSize:13}}>{r.time}</td><td>{statusBadge(r.status)}</td></tr>)}</tbody></table></div></div>
      <div className="card"><div className="card-hdr"><span className="card-title">Quick Stats</span></div><div className="card-body-pad">
        <div className="quick-row"><span className="quick-label">Avg Response Time</span><span className="quick-val" style={{color:'var(--teal)'}}>{stats.avgResponseTime}</span></div><div className="divider"/>
        <div className="quick-row"><span className="quick-label">Avg Rating</span><span className="quick-val" style={{color:'var(--warn)'}}>{'★'.repeat(Math.round(parseFloat(stats.avgRating)))} {stats.avgRating}</span></div><div className="divider"/>
        <div className="quick-row"><span className="quick-label">Resolution Rate</span><span className="quick-val" style={{color:'var(--success)'}}>{Math.round((stats.resolvedRequests/stats.totalRequests)*100)}%</span></div><div className="divider"/>
        <div className="quick-row"><span className="quick-label">Active Responders</span><span className="quick-val" style={{color:'var(--navy)'}}>{stats.totalResponders}</span></div>
      </div></div>
    </div>
  </div>;
}

function RequestsPage() {
  const [requests,setRequests]=useState([]); const [filter,setFilter]=useState('All'); const [selected,setSelected]=useState(null); const [loading,setLoading]=useState(true);
  useEffect(()=>{api.fetchRequests().then(d=>{setRequests(d);setLoading(false)})},[]);
  const statuses=['All','Pending','Assigned','En Route','Resolved','Cancelled'];
  const filtered=filter==='All'?requests:requests.filter(r=>r.status===filter);
  if(loading) return <div className="loading">Loading requests...</div>;
  return <div>
    <div className="page-hdr"><h2 className="page-title">Emergency Requests</h2><p className="page-sub">Manage and monitor all emergency requests</p></div>
    <div className="card"><div className="card-hdr"><span className="card-title">All Requests ({filtered.length})</span><div className="filter-row">{statuses.map(s=><button key={s} className={`filter-chip ${filter===s?'active':''}`} onClick={()=>setFilter(s)}>{s}</button>)}</div></div>
    <div className="card-body tbl-wrap"><table><thead><tr><th>ID</th><th>User</th><th>Time</th><th>Location</th><th>Responder</th><th>Priority</th><th>Status</th></tr></thead>
    <tbody>{filtered.map(r=><tr key={r.id} className="click" onClick={()=>setSelected(r)}><td style={{fontWeight:600,color:'var(--navy)'}}>{r.id}</td><td>{r.user}</td><td style={{color:'var(--text-sec)',fontSize:13}}>{r.time}</td><td style={{maxWidth:200,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{r.location}</td><td>{r.responder}</td><td>{priorityBadge(r.priority)}</td><td>{statusBadge(r.status)}</td></tr>)}</tbody></table></div></div>
    {selected&&<div className="modal-ov" onClick={()=>setSelected(null)}><div className="modal" onClick={e=>e.stopPropagation()}><div className="modal-hdr"><span className="modal-title">Request {selected.id}</span><button className="modal-close" onClick={()=>setSelected(null)}>×</button></div><div className="modal-body"><div className="detail-grid">
      <div className="detail-item"><span className="detail-label">Reported By</span><span className="detail-value">{selected.user}</span></div>
      <div className="detail-item"><span className="detail-label">Phone</span><span className="detail-value">{selected.phone}</span></div>
      <div className="detail-item"><span className="detail-label">Time</span><span className="detail-value">{selected.time}</span></div>
      <div className="detail-item"><span className="detail-label">Priority</span><span className="detail-value">{priorityBadge(selected.priority)}</span></div>
      <div className="detail-item detail-full"><span className="detail-label">Location</span><span className="detail-value">{selected.location}</span></div>
      <div className="detail-item"><span className="detail-label">Assigned Responder</span><span className="detail-value">{selected.responder}</span></div>
      <div className="detail-item"><span className="detail-label">Status</span><span className="detail-value">{statusBadge(selected.status)}</span></div>
      <div className="detail-item detail-full"><span className="detail-label">Description</span><span className="detail-value">{selected.description}</span></div>
    </div></div></div></div>}
  </div>;
}

function RespondersPage() {
  const [responders,setResponders]=useState([]); const [loading,setLoading]=useState(true); const [showAdd,setShowAdd]=useState(false);
  const [form,setForm]=useState({name:'',email:'',phone:'',zone:''});
  useEffect(()=>{api.fetchResponders().then(d=>{setResponders(d);setLoading(false)})},[]);
  const handleAdd=(e)=>{e.preventDefault();if(!form.name||!form.email)return;setResponders([...responders,{id:'R'+(responders.length+1),...form,availability:'Available',totalResolved:0,joinDate:new Date().toISOString().split('T')[0]}]);setForm({name:'',email:'',phone:'',zone:''});setShowAdd(false)};
  const toggleStatus=(id)=>{setResponders(responders.map(r=>{if(r.id!==id)return r;const n={Available:'Busy',Busy:'Inactive',Inactive:'Available'};return{...r,availability:n[r.availability]||'Available'}}))};
  if(loading) return <div className="loading">Loading responders...</div>;
  return <div>
    <div className="page-hdr"><h2 className="page-title">Responders</h2><p className="page-sub">Manage rescue responder teams</p></div>
    <div className="card"><div className="card-hdr"><span className="card-title">All Responders ({responders.length})</span><button className="btn btn-pri btn-sm" onClick={()=>setShowAdd(true)}>+ Add Responder</button></div>
    <div className="card-body tbl-wrap"><table><thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Zone</th><th>Resolved</th><th>Availability</th><th>Actions</th></tr></thead>
    <tbody>{responders.map(r=><tr key={r.id}><td style={{fontWeight:600}}>{r.name}</td><td style={{color:'var(--text-sec)'}}>{r.email}</td><td>{r.phone}</td><td>{r.zone}</td><td style={{fontWeight:600}}>{r.totalResolved}</td><td>{availBadge(r.availability)}</td><td><button className="btn btn-sec btn-sm" onClick={()=>toggleStatus(r.id)}>Toggle Status</button></td></tr>)}</tbody></table></div></div>
    {showAdd&&<div className="modal-ov" onClick={()=>setShowAdd(false)}><div className="modal" onClick={e=>e.stopPropagation()}><div className="modal-hdr"><span className="modal-title">Add Responder</span><button className="modal-close" onClick={()=>setShowAdd(false)}>×</button></div><div className="modal-body"><form onSubmit={handleAdd}>
      <div className="fg"><label className="fl">Unit Name</label><input className="fi" value={form.name} onChange={e=>setForm({...form,name:e.target.value})} placeholder="Rescue Unit Name" required/></div>
      <div className="fg"><label className="fl">Email</label><input className="fi" type="email" value={form.email} onChange={e=>setForm({...form,email:e.target.value})} placeholder="unit@rms.gov.pk" required/></div>
      <div className="fg"><label className="fl">Phone</label><input className="fi" value={form.phone} onChange={e=>setForm({...form,phone:e.target.value})} placeholder="+92 300 0000000"/></div>
      <div className="fg"><label className="fl">Zone</label><input className="fi" value={form.zone} onChange={e=>setForm({...form,zone:e.target.value})} placeholder="e.g., North Karachi"/></div>
      <button type="submit" className="btn btn-pri" style={{width:'100%'}}>Add Responder</button>
    </form></div></div></div>}
  </div>;
}

function UsersPage() {
  const [users,setUsers]=useState([]); const [loading,setLoading]=useState(true);
  useEffect(()=>{api.fetchUsers().then(d=>{setUsers(d);setLoading(false)})},[]);
  if(loading) return <div className="loading">Loading users...</div>;
  return <div>
    <div className="page-hdr"><h2 className="page-title">Users</h2><p className="page-sub">Registered citizens in the system</p></div>
    <div className="card"><div className="card-hdr"><span className="card-title">All Users ({users.length})</span></div>
    <div className="card-body tbl-wrap"><table><thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>CNIC</th><th>Total Requests</th></tr></thead>
    <tbody>{users.map(u=><tr key={u.id}><td style={{fontWeight:600}}>{u.name}</td><td style={{color:'var(--text-sec)'}}>{u.email}</td><td>{u.phone}</td><td style={{fontFamily:'monospace',fontSize:13}}>{u.cnic}</td><td><span style={{background:u.totalRequests>=3?'var(--warn-l)':'var(--info-l)',color:u.totalRequests>=3?'var(--warn)':'var(--info)',padding:'4px 12px',borderRadius:20,fontWeight:600,fontSize:13}}>{u.totalRequests}</span></td></tr>)}</tbody></table></div></div>
  </div>;
}

function FeedbackPage() {
  const [feedback,setFeedback]=useState([]); const [loading,setLoading]=useState(true);
  useEffect(()=>{api.fetchFeedback().then(d=>{setFeedback(d);setLoading(false)})},[]);
  if(loading) return <div className="loading">Loading feedback...</div>;
  const avg=(feedback.reduce((a,f)=>a+f.rating,0)/feedback.length).toFixed(1);
  return <div>
    <div className="page-hdr"><h2 className="page-title">Feedback</h2><p className="page-sub">User reviews and ratings for resolved requests</p></div>
    <div className="stats-grid" style={{gridTemplateColumns:'repeat(auto-fit,minmax(180px,1fr))'}}>
      <div className="stat-card"><div className="stat-info stat-center"><div className="stat-val">{feedback.length}</div><div className="stat-lbl">Total Reviews</div></div></div>
      <div className="stat-card"><div className="stat-info stat-center"><div className="stat-val" style={{color:'var(--warn)'}}>{avg}</div><div className="stat-lbl">Average Rating</div></div></div>
      <div className="stat-card"><div className="stat-info stat-center"><div className="stat-val" style={{color:'var(--success)'}}>{feedback.filter(f=>f.rating>=4).length}</div><div className="stat-lbl">Positive (4-5 Stars)</div></div></div>
    </div>
    <div className="card"><div className="card-hdr"><span className="card-title">All Feedback</span></div>
    <div className="card-body tbl-wrap"><table><thead><tr><th>Request ID</th><th>User</th><th>Responder</th><th>Rating</th><th>Comment</th><th>Date</th></tr></thead>
    <tbody>{feedback.map(f=><tr key={f.id}><td style={{fontWeight:600,color:'var(--navy)'}}>{f.requestId}</td><td>{f.user}</td><td>{f.responder}</td><td><span className="stars">{'★'.repeat(f.rating)}{'☆'.repeat(5-f.rating)}</span></td><td style={{maxWidth:280,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{f.comment}</td><td style={{color:'var(--text-sec)',fontSize:13}}>{f.date}</td></tr>)}</tbody></table></div></div>
  </div>;
}

function LogsPage() {
  const [logs,setLogs]=useState([]); const [stats,setStats]=useState(null); const [loading,setLoading]=useState(true);
  useEffect(()=>{Promise.all([api.fetchLogs(),api.fetchReports()]).then(([l,r])=>{setLogs(l);setStats(r);setLoading(false)})},[]);
  if(loading) return <div className="loading">Loading logs...</div>;
  const actionColor=(a)=>{if(a.includes('Created'))return'var(--info)';if(a.includes('Assigned'))return'var(--teal)';if(a.includes('Resolved'))return'var(--success)';if(a.includes('Cancelled'))return'var(--danger)';return'var(--text)'};
  return <div>
    <div className="page-hdr"><h2 className="page-title">Logs & Reports</h2><p className="page-sub">System activity logs and summary reports</p></div>
    <div className="stats-grid">
      <div className="stat-card"><div className="stat-icon" style={{background:'rgba(59,130,246,.1)',color:'#3b82f6'}}>📋</div><div className="stat-info"><div className="stat-val">{stats.totalRequests}</div><div className="stat-lbl">Total Requests</div></div></div>
      <div className="stat-card"><div className="stat-icon" style={{background:'rgba(16,185,129,.1)',color:'#10b981'}}>✅</div><div className="stat-info"><div className="stat-val">{stats.resolvedRequests}</div><div className="stat-lbl">Resolved</div></div></div>
      <div className="stat-card"><div className="stat-icon" style={{background:'rgba(13,148,136,.1)',color:'#0d9488'}}>⏱</div><div className="stat-info"><div className="stat-val">{stats.avgResponseTime}</div><div className="stat-lbl">Avg Response</div></div></div>
      <div className="stat-card"><div className="stat-icon" style={{background:'rgba(245,158,11,.1)',color:'#f59e0b'}}>⭐</div><div className="stat-info"><div className="stat-val">{stats.avgRating}</div><div className="stat-lbl">Avg Rating</div></div></div>
    </div>
    <div className="card"><div className="card-hdr"><span className="card-title">Activity Logs</span><span style={{fontSize:13,color:'var(--text-mut)'}}>{logs.length} entries</span></div>
    <div className="card-body tbl-wrap"><table><thead><tr><th>Timestamp</th><th>Action</th><th>Details</th></tr></thead>
    <tbody>{logs.map(l=><tr key={l.id}><td style={{fontFamily:'monospace',fontSize:13,color:'var(--text-sec)',whiteSpace:'nowrap'}}>{l.timestamp}</td><td><span style={{color:actionColor(l.action),fontWeight:600,fontSize:13}}>{l.action}</span></td><td>{l.details}</td></tr>)}</tbody></table></div></div>
  </div>;
}

function SettingsPage() {
  const [settings,setSettings]=useState({searchRadius:5000,duplicateTimeWindow:30,defaultCity:'Karachi'}); const [loading,setLoading]=useState(true); const [saving,setSaving]=useState(false); const [success,setSuccess]=useState('');
  useEffect(()=>{api.fetchSettings().then(s=>{setSettings(s);setLoading(false)})},[]);
  const handleSave=async(e)=>{e.preventDefault();setSaving(true);const res=await api.saveSettings(settings);setSaving(false);if(res.success){setSuccess(res.message);setTimeout(()=>setSuccess(''),3000)}};
  if(loading) return <div className="loading">Loading settings...</div>;
  return <div>
    <div className="page-hdr"><h2 className="page-title">Settings</h2><p className="page-sub">Configure system parameters</p></div>
    <div className="card" style={{maxWidth:600}}><div className="card-hdr"><span className="card-title">System Configuration</span></div><div className="card-body-pad">
      {success&&<div className="success-msg">✓ {success}</div>}
      <form onSubmit={handleSave}>
        <div className="fg"><label className="fl">Search Radius (meters)</label><input type="number" className="fi" value={settings.searchRadius} onChange={e=>setSettings({...settings,searchRadius:parseInt(e.target.value)||0})}/><div className="fh">Maximum distance for nearby responder search</div></div>
        <div className="fg"><label className="fl">Duplicate Request Time Window (minutes)</label><input type="number" className="fi" value={settings.duplicateTimeWindow} onChange={e=>setSettings({...settings,duplicateTimeWindow:parseInt(e.target.value)||0})}/><div className="fh">Prevent duplicate reports within this time</div></div>
        <div className="fg"><label className="fl">Default City</label><select className="fs" value={settings.defaultCity} onChange={e=>setSettings({...settings,defaultCity:e.target.value})}><option>Karachi</option><option>Lahore</option><option>Islamabad</option><option>Rawalpindi</option><option>Faisalabad</option><option>Multan</option><option>Peshawar</option><option>Quetta</option></select></div>
        <button type="submit" className="btn btn-pri" disabled={saving} style={{marginTop:8}}>{saving?'Saving...':'Save Settings'}</button>
      </form>
    </div></div>
  </div>;
}

// === Navigation ===
const menuItems = [
  { page:'dashboard', icon:'📊', label:'Dashboard' },
  { page:'requests', icon:'🚨', label:'Emergency Requests' },
  { page:'responders', icon:'🚑', label:'Responders' },
  { page:'users', icon:'👥', label:'Users' },
  { page:'feedback', icon:'⭐', label:'Feedback' },
  { page:'logs', icon:'📋', label:'Logs & Reports' },
  { page:'settings', icon:'⚙️', label:'Settings' },
];

// === Main App ===
function App() {
  const [auth, setAuth] = useState(localStorage.getItem('rms_admin_auth')==='true');
  const [page, setPage] = useState('dashboard');
  const [collapsed, setCollapsed] = useState(false);

  if (!auth) {
    return <LoginScreen onLogin={()=>setAuth(true)} />;
  }

  const handleLogout = () => { localStorage.removeItem('rms_admin_auth'); setAuth(false); };

  const renderPage = () => {
    switch(page) {
      case 'dashboard': return <DashboardPage />;
      case 'requests': return <RequestsPage />;
      case 'responders': return <RespondersPage />;
      case 'users': return <UsersPage />;
      case 'feedback': return <FeedbackPage />;
      case 'logs': return <LogsPage />;
      case 'settings': return <SettingsPage />;
      default: return <DashboardPage />;
    }
  };

  return (
    <div className="admin-layout">
      <aside className={`sidebar ${collapsed?'collapsed':''}`}>
        <div className="sidebar-hdr">
          <div className="sidebar-logo"><div className="logo-icon">RMS</div>{!collapsed&&<span className="logo-text">Admin Panel</span>}</div>
          <button className="sidebar-toggle" onClick={()=>setCollapsed(!collapsed)}>{collapsed?'→':'←'}</button>
        </div>
        <nav className="sidebar-nav">
          {menuItems.map(item=>(
            <button key={item.page} className={`sidebar-link ${page===item.page?'active':''}`} onClick={()=>setPage(item.page)} title={collapsed?item.label:''}>
              <span className="sidebar-icon">{item.icon}</span>
              {!collapsed&&<span className="sidebar-label">{item.label}</span>}
            </button>
          ))}
        </nav>
        <div className="sidebar-footer">{!collapsed&&<div className="sidebar-ver"><span>Rescue Management System</span><span className="ver-num">v1.0.0</span></div>}</div>
      </aside>

      <div className={`admin-main ${collapsed?'collapsed':''}`}>
        <header className="topbar">
          <div className="topbar-left"><h1 className="topbar-title">Rescue Management System</h1><span className="topbar-badge">Admin Dashboard</span></div>
          <div className="topbar-right">
            <div className="topbar-user"><div className="topbar-avatar">A</div><div className="topbar-uinfo"><span className="topbar-name">Admin</span><span className="topbar-role">System Administrator</span></div></div>
            <button className="topbar-logout" onClick={handleLogout}>Logout</button>
          </div>
        </header>
        <div className="admin-content">{renderPage()}</div>
      </div>
    </div>
  );
}

function LoginScreen({ onLogin }) {
  const [email,setEmail]=useState(''); const [password,setPassword]=useState(''); const [error,setError]=useState('');
  const handleLogin=(e)=>{e.preventDefault();if(!email.trim()||!password.trim()){setError('Please enter both email and password');return}localStorage.setItem('rms_admin_auth','true');onLogin()};
  return (
    <div className="login-page">
      <div className="login-bg"/>
      <div className="login-card">
        <div className="login-header"><div className="login-logo-icon">RMS</div><h1 className="login-title">Rescue Management System</h1><p className="login-subtitle">Admin Dashboard Login</p></div>
        <form onSubmit={handleLogin} className="login-form">
          {error&&<div className="login-error">{error}</div>}
          <div className="fg"><label className="fl">Email Address</label><input type="email" className="fi" placeholder="admin@rms.gov.pk" value={email} onChange={e=>{setEmail(e.target.value);setError('')}}/></div>
          <div className="fg"><label className="fl">Password</label><input type="password" className="fi" placeholder="Enter your password" value={password} onChange={e=>{setPassword(e.target.value);setError('')}}/></div>
          <button type="submit" className="login-btn">Sign In</button>
        </form>
        <p className="login-footer">Authorized personnel only</p>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
